name: EMP-RECORD
organization: sequential
n-encode: sjis
record:
    # 集団項目（EMP）配下に基本項目をネストできる
    - EMP:
        - type: 9(5)
          name: EMP-ID
          value: 0
        - type: X(20)
          name: EMP-NAME
        - type: N(8)
          name: EMP-NAME-KANJI
    - type: S9(7)V99
      name: SALARY
      usage: COMP-3
    - type: S9(1)V99
      name: BONUS-RATE
    # 無名の FILLER 項目（型は X）。値はデータ行で指定する。
    - type: FILLER(3)
data:
    # 値は record をフラット化した順に並べる（集団項目の値は持たない）
    - [123, John Smith, 山田太郎, 1234567.89, -1.25, "***"]
    - [7, Alice, 鈴木花子, -42.5, 0.5, "---"]
